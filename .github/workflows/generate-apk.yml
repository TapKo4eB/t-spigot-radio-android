name: build apk

on:

  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: setup oracle hellhole
        uses: actions/setup-java@v6
        with:
          distribution: 'oracle'
          java-version: 'latest'
          cache: 'gradle'

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > tspigot_release_key.jks
        
      - name: chmooooooood
        run: chmod +x ./gradlew

      - name: build debug APK
        run: ./gradlew assembleDebug

      - name: build release APK
        run: ./gradlew assembleRelease

      - name: sign APK
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore tspigot_release_key.jks -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            app/build/outputs/apk/release/app-release-unsigned.apk ${{ secrets.KEY_ALIAS }}

      - name: verify signature
        run: jarsigner -verify -verbose -certs app/build/outputs/apk/release/app-release-unsigned.apk

      - name: align APK
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release.apk
  
      - name: upload debug apk
        uses: actions/upload-artifact@v7
        with:
          name: tspigotradio-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          archive: false

      - name: upload release apk
        uses: actions/upload-artifact@v7
        with:
          name: tspigotradio-release
          path: app/build/outputs/apk/release/app-release.apk
          archive: false
          
